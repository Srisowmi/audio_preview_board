name: CI and deploy backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'audio-preview-prod' }}
  LAMBDA_FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME || 'audio-preview-prod' }}

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Vet
        run: go vet ./...

      - name: Unit tests (race detector)
        run: go test -race ./...

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck and build
        run: npm run build

  # Deploys only for pushes to main (never for pull requests).
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    # Required for GitHub OIDC -> AWS role assumption.
    permissions:
      id-token: write
      contents: read
    env:
      # The secrets context can't be used in step `if:` directly, so expose a flag.
      AWS_CONFIGURED: ${{ secrets.AWS_ROLE_ARN != '' }}
    steps:
      - name: Check AWS configuration
        if: env.AWS_CONFIGURED != 'true'
        run: echo "::notice::Secret AWS_ROLE_ARN is not set, so the AWS deploy steps were skipped. Tests passed; add the secret once the AWS infrastructure exists (see README)."

      - uses: actions/checkout@v4
        if: env.AWS_CONFIGURED == 'true'

      # TEMPORARY DEBUG: print only the sub and aud claims of the OIDC token. Remove once the role trust works.
      - name: Debug OIDC claims
        if: env.AWS_CONFIGURED == 'true'
        run: |
          TOKEN=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "::add-mask::$TOKEN"
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          case $(( ${#PAYLOAD} % 4 )) in
            2) PAYLOAD="$PAYLOAD==" ;;
            3) PAYLOAD="$PAYLOAD=" ;;
          esac
          echo "$PAYLOAD" | base64 -d | jq '{sub, aud}'

      - name: Configure AWS credentials (OIDC)
        if: env.AWS_CONFIGURED == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: env.AWS_CONFIGURED == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        if: env.AWS_CONFIGURED == 'true'
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          # --provenance=false: Lambda rejects the OCI index that buildx attestations produce.
          docker build --provenance=false \
            -t "$IMAGE:$GITHUB_SHA" \
            -t "$IMAGE:latest" \
            backend
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
          echo "uri=$IMAGE:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Update Lambda function
        if: env.AWS_CONFIGURED == 'true'
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          if aws lambda get-function --function-name "$LAMBDA_FUNCTION_NAME" > /dev/null 2>&1; then
            aws lambda update-function-code \
              --function-name "$LAMBDA_FUNCTION_NAME" \
              --image-uri "$IMAGE_URI" > /dev/null
            aws lambda wait function-updated --function-name "$LAMBDA_FUNCTION_NAME"
            echo "Deployed $IMAGE_URI to $LAMBDA_FUNCTION_NAME"
          else
            echo "::notice::Lambda function '$LAMBDA_FUNCTION_NAME' does not exist yet. Image pushed; run 'terraform apply' to create it."
          fi
